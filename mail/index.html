<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メール講座の登録｜人生これから研究所</title>
<!-- 🔴このページは動作確認用。原稿が決まるまで検索にもsitemapにも載せない。
     本番の登録ページへ昇格するときに、この行と noindex を外す -->
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
:root{
  --bg:#faf6ee;
  --ink:#372c24;
  --ink-soft:#6f6052;
  --amber:#b0741c;
  --amber-deep:#8f5e14;
  --card:#fffdf8;
  --line:#e6dac4;
  --shadow:0 2px 14px rgba(66,50,32,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Noto Sans JP",-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:var(--bg);color:var(--ink);
  font-size:16.5px;line-height:1.95;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto;padding:56px 20px 72px}
h1{
  font-family:"Shippori Mincho",serif;font-weight:700;
  font-size:1.6rem;line-height:1.6;margin-bottom:18px;
}
.lead{color:var(--ink-soft);margin-bottom:32px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:28px 22px;box-shadow:var(--shadow);
}
label{display:block;font-weight:500;margin-bottom:8px}
input[type=email]{
  width:100%;padding:14px 14px;font-size:16px;
  border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
}
input[type=email]:focus{outline:2px solid var(--amber);outline-offset:1px}
.cf-turnstile{margin:18px 0 14px}
button{
  width:100%;padding:15px;font-size:1.05rem;font-weight:700;
  color:#fff;background:var(--amber);border:0;border-radius:9px;cursor:pointer;
  font-family:inherit;
}
button:hover{background:var(--amber-deep)}
button:disabled{opacity:.6;cursor:default}
#rondo-status{margin-top:14px;font-size:.95rem;min-height:1.6em}
.notes{
  margin-top:26px;font-size:.86rem;line-height:1.9;color:var(--ink-soft);
}
.notes a{color:var(--amber-deep)}
.back{display:inline-block;margin-top:34px;font-size:.9rem;color:var(--ink-soft)}
</style>
</head>
<body>
<div class="wrap">

  <h1>メール講座の登録</h1>
  <p class="lead">メールアドレスを入れて送信すると、確認メールが届きます。<br>
  そのメールのリンクを開くと登録が完了します。</p>

  <div class="card">
    <form id="rondo-subscribe">
      <label for="rondo-email">メールアドレス</label>
      <input
        id="rondo-email"
        name="email"
        type="email"
        inputmode="email"
        autocomplete="email"
        spellcheck="false"
        placeholder="you@example.com"
        required
      >
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAEbRcNOfgWlNIWPL"></div>
      <!-- ハニーポット。人間には見えない。必ず空のまま送る -->
      <div aria-hidden="true" style="position:absolute;left:-10000px">
        <label for="rondo-website">Website</label>
        <input id="rondo-website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>
      <button type="submit">登録確認メールを受け取る</button>
      <p id="rondo-status" role="status" aria-live="polite"></p>
    </form>
  </div>

  <div class="notes">
    ※メール内のリンクから、<b>いつでもワンクリックで解除できます。</b><br>
    ※ご登録情報は、このメールの配信以外には使用しません。<br>
    ※発行者の氏名・所在地・お問い合わせ先は <a href="https://korekaralab.com/info/" target="_blank" rel="noopener">運営者情報</a> をご覧ください。
  </div>

  <a class="back" href="https://korekaralab.com/">← 人生これから研究所</a>

</div>

<script>
  (() => {
    const form = document.getElementById('rondo-subscribe');
    const status = document.getElementById('rondo-status');
    const button = form.querySelector('button[type="submit"]');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const data = new FormData(form);
      const cfToken = data.get('cf-turnstile-response');
      if (!cfToken) {
        status.textContent = 'bot確認を完了してから、もう一度お試しください。';
        return;
      }
      button.disabled = true;
      button.textContent = '送信中…';
      status.textContent = '';
      try {
        const response = await fetch('https://rondo.jinsei-korekara-lab.workers.dev/api/subscribe', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            email: data.get('email'),
            website: data.get('website'),
            cfToken,
            source: 'web',
          }),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        form.reset();
        status.textContent = '確認メールを送りました。受信箱のリンクを開いて登録を完了してください。';
      } catch {
        status.textContent = '送信できませんでした。通信状態を確認し、bot確認をやり直してください。';
        if (window.turnstile) window.turnstile.reset();
      } finally {
        button.disabled = false;
        button.textContent = '登録確認メールを受け取る';
      }
    });
  })();
</script>
<!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "9961ede6882241fb98504c8c4b8fc963"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
